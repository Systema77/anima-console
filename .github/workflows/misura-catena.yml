# COSA FA — misura la catena (strumenti, galassia, code) e riscrive il blocco
#   «in piazza» della plancia, `docs/regia/`. Poi committa la pagina sul ramo,
#   cosi' il Direttore la apre dal telefono e legge una misura, non un ricordo.
# PERCHE ESISTE — da una sessione agente questa misura NON si puo' fare:
#   l'egress risponde 403 al CONNECT su ogni host nostro (misurato il 06/09, e
#   gia' misurato da PROVINO il 04/09). Il runner ha la rete che l'agente non ha.
#   E' lo stesso motivo per cui esistono «Prova della porta» e «Prova del Worker».
# FIN DOVE ARRIVA — solo GET su host nostri e sull'API pubblica delle issue.
#   Nessun POST, nessun `authorization`, nessun segreto: lo script non legge
#   nessuna chiave e non ne manda nessuna. Misura la strada, non apre niente.
#   Le due chiavi che si proverebbero solo usandole (Cloudflare, Porkbun)
#   restano «senza prova»: non verdi e non rosse.
# COSTO — zero: nessuna API a pagamento, nessun token.
# USO — Actions -> «Misura della catena» -> Run workflow. Parte anche da sola
#   quando si tocca questo file o lo script: il filtro `paths` e' anche la
#   guardia contro il rimbalzo, perche' il commit di ritorno tocca solo
#   docs/regia/index.html e quindi non si richiama da capo.
# — creato da SQUELCH, 2026-09-06

name: Misura della catena

on:
  # ⏱ TRE VOLTE AL GIORNO — 06:00, 12:00 e 18:00 UTC (08 · 14 · 20 in Italia).
  #   Ordine del Direttore del 07/09: «trova un modo di tenere aggiornata la regia,
  #   inizio finalmente a usarla». Prima girava solo a mano o quando si toccava lo
  #   script: la plancia diceva il vero dell'ultima volta che qualcuno l'aveva
  #   lanciata, che non e' la stessa cosa.
  #   Il passo 2 committa SOLO se la pagina e' cambiata: un giro a vuoto non lascia
  #   traccia e non costa niente.
  #   ⚠️ CONSEGUENZA DA SAPERE, ed e' la domanda che SQUELCH aveva lasciato aperta il
  #   06/09: cosi' il workflow scrive dentro `docs/` da solo, che per regola e' del
  #   Direttore. E' il prezzo di una console che si aggiorna da se', e l'ha chiesto
  #   lui. Scrive solo il blocco fra i marcatori, mai testo editoriale, e ogni
  #   scrittura resta un commit visibile. Per spegnerlo: si toglie `schedule`.
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:
  push:
    # ⚠️ AGGIUNTO IL 20/09, e senza questo il passo 2 e' pericoloso.
    # Qui c'era solo `paths:`. Segnalato da SHUTTER il 15/09: un push su un ramo
    # QUALUNQUE che tocchi uno di quei percorsi faceva girare il workflow SU QUEL
    # RAMO, e il passo 2 gli committava dentro docs/regia/index.html e lo spingeva
    # con `HEAD:${GITHUB_REF_NAME}`. Cioe' il runner scriveva nel ramo di lavoro di
    # chi stava solo modificando lo script.
    # 📜 Un filtro sui PERCORSI dice QUANDO partire, non DOVE scrivere: sono due
    #    domande diverse, e mancava la seconda.
    # Va riparato insieme al retry qui sotto e non dopo: un push che ritenta tre
    # volte su un ramo sbagliato e' peggio di uno che fallisce una volta sola.
    branches:
      - main
    paths:
      - '.github/workflows/misura-catena.yml'
      - 'scripts/misura_catena.py'
      # La scrivania (08/09): un prompt o una decisione nuova arriva in regia al push,
      # senza aspettare il giro delle sei.
      - 'scripts/regia_scrivania.py'
      - 'squadra/rinascita/**'
      - 'squadra/DECISIONI.md'

permissions:
  contents: write

concurrency:
  group: misura-catena-${{ github.ref }}
  cancel-in-progress: false

jobs:
  misura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 0 · Bersaglio di controllo — la rete del runner funziona?
        # Prima di dichiarare morto qualcosa si prova un bersaglio noto vivo.
        # Se muore anche questo, il guasto e' del runner e tutto il resto del
        # referto va buttato. Lo script rifa' questo controllo per conto suo:
        # qui sta perche' il log lo dica prima di ogni altra riga.
        run: |
          set -u
          COD=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 https://github.com/ || echo 000)
          echo "github.com: $COD"
          [ "$COD" != "000" ] || { echo "✗ rete del runner morta: nessuna conclusione lecita"; exit 1; }

      - name: 1 · La misura
        # Uscita 2 = «il metro risponde ma nessuno dei nostri»: cieco chi misura.
        # Lo script in quel caso NON scrive, e il passo deve fallire: un referto
        # che non ha misurato niente non deve sembrare andato bene.
        run: python3 scripts/misura_catena.py

      - name: 1b · La scrivania — prompt da lanciare, PR aperte, decisioni
        # Ordine del Direttore dell'08/09: «voglio usare SOLO la regia». Legge
        # squadra/rinascita/, squadra/DECISIONI.md e le PR aperte dei repo pubblici
        # (API pubblica, nessun token) e riscrive il blocco REGIA:SCRIVANIA della
        # stessa pagina. Se l'API non risponde lo scrive in pagina, non finge zero.
        run: python3 scripts/regia_scrivania.py

      - name: 2 · Committa la pagina, se e' cambiata
        # ⚠️ RIPARATO IL 20/09 — il push falliva, e non per la rete.
        # Fra `actions/checkout` e `git push` il ramo remoto puo' muoversi: basta
        # un altro push, di una persona o di un altro workflow. Il run che ha
        # scoperto il guasto aveva fatto il commit dd3015b e si e' preso
        # «! [rejected] HEAD -> main (fetch first)». Non e' un caso raro: questo
        # gira tre volte al giorno piu' a ogni push sui percorsi sorvegliati.
        #
        # ⛔ E NON SI RIPARA CON --force NE' CON --force-with-lease: qui il ramo e'
        # main, e forzare vuol dire cancellare il commit di qualcun altro per
        # pubblicare una pagina generata. Una misura non vale un lavoro.
        #
        # Si rifa' la misura DOPO il reset, e non si riusa quella dei passi 1 e 1b:
        # se main si e' mosso, la pagina va ricalcolata sullo stato nuovo, altrimenti
        # si pubblica una misura del passato con la data di adesso.
        # 📜 Ritentare senza rimisurare non e' riprovare: e' insistere.
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"

          for tentativo in 1 2 3; do
            echo "── pubblicazione, tentativo ${tentativo}/3"

            git fetch --no-tags origin "$branch"
            # FETCH_HEAD e non origin/$branch: il fetch appena fatto lo aggiorna
            # sempre, mentre `origin/$branch` dipende dal refspec che checkout ha
            # configurato. Se quel refspec non copre il ramo, `reset` tornerebbe
            # sul commit VECCHIO e i tre tentativi fallirebbero tutti allo stesso
            # modo, in un ciclo che sembra una race e non lo e'.
            git reset --hard FETCH_HEAD

            python3 scripts/misura_catena.py
            python3 scripts/regia_scrivania.py

            if [ -z "$(git status --porcelain -- docs/regia/index.html)" ]; then
              echo "= la pagina dice gia' quello che ho misurato: niente da committare"
              exit 0
            fi

            git config user.name  "misura-catena"
            git config user.email "misura-catena@users.noreply.github.com"
            # `-m` PRIMA di `--`: dopo i due trattini git legge solo percorsi, e
            # al run #1 si e' preso «-m» e il messaggio per due nomi di file.
            git commit -m "La catena misurata dal runner: $(date -u '+%Y-%m-%d %H:%M UTC')" \
              -- docs/regia/index.html

            if git push origin "HEAD:${branch}"; then
              echo "✓ pagina aggiornata sul ramo ${branch}"
              exit 0
            fi

            echo "  il ramo remoto si e' mosso durante il push: rimisuro e riprovo"
          done

          echo "✗ non sono riuscito a pubblicare in 3 tentativi: il ramo si muove"
          echo "  piu' in fretta di quanto ci metto a misurare. Non forzo."
          exit 1

      - name: 3 · Cosa legge il Direttore — le righe, in chiaro nel log
        if: always()
        run: |
          set -u
          sed -n '/REGIA:CATENA:INIZIO/,/REGIA:CATENA:FINE/p' docs/regia/index.html \
            | sed -e 's/<[^>]*>/ /g' -e 's/  */ /g' -e '/^ *$/d'
