# AGGIORNATO 2026-09-07 (D.R.A.G.O.) — passo 5: le altre tre case (systema77.com,
#   animagame.io, anima.solar). Motivo: i sette repo sono passati all'organizzazione
#   GitHub `Systema77` e un trasferimento puo' far cadere il dominio di Pages. Questa
#   prova ne guardava due su sei: sulle altre quattro «non si e' rotto niente» era una
#   speranza. (La radio era gia' al passo 4.)
# COSA FA — risponde a tre domande che da una sessione agente non si possono
#   fare (l'egress risponde 403 su ogni host nostro): ① la PORTA di
#   cyberboomer.io arriva in HTTPS con un certificato valido, ed è la porta
#   (campo della frase + blocco cifrato)? ② cyberboomer.ninja serve la versione
#   col blu link, in HTTPS? ③ console.cyberboomer.io esiste o no?
# PERCHE ESISTE — il Direttore dice «non riesco ad accedere alla consolle»: la
#   porta deriva la chiave con crypto.subtle, che il browser SPEGNE se la
#   pagina non arriva in HTTPS. Prima di dire «è la frase sbagliata» si misura
#   la strada: un guasto di certificato e una frase sbagliata si presentano allo
#   stesso modo a chi sta davanti al telefono.
# FIN DOVE ARRIVA — solo GET e HEAD, nessun POST, nessun segreto, nessuna
#   frase: misura la STRADA, non apre la porta. Guarda il corpo, non il codice.
# COSTO — zero. USO — Actions → «Prova della porta» → Run workflow.
# — creato da D.R.A.G.O., 2026-09-05

name: Prova della porta

on:
  workflow_dispatch:

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: 0 · Bersaglio di controllo — la rete del runner funziona?
        run: |
          set -u
          COD=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 https://github.com/ || echo 000)
          echo "github.com: $COD"; [ "$COD" != "000" ] || { echo "✗ rete del runner morta: nessuna conclusione lecita"; exit 1; }

      - name: 1 · cyberboomer.io — HTTPS, certificato, ed è la PORTA?
        run: |
          set -u
          echo "== certificato =="
          echo | openssl s_client -connect cyberboomer.io:443 -servername cyberboomer.io 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "✗ nessun certificato letto"
          echo "== http → ? =="
          curl -sS -o /dev/null -w 'http://cyberboomer.io/ → %{http_code} → %{redirect_url}\n' --max-time 25 http://cyberboomer.io/ || true
          echo "== https GET =="
          COD=$(curl -sS -o /tmp/porta.html -w '%{http_code}' --max-time 25 https://cyberboomer.io/ || echo 000)
          echo "codice: $COD · byte: $(wc -c < /tmp/porta.html)"
          grep -q 'frase di sblocco' /tmp/porta.html && echo "✓ c'è il campo della frase" || echo "✗ manca il campo della frase"
          grep -q 'PORTA_PAYLOAD' /tmp/porta.html && echo "✓ c'è il blocco cifrato (PORTA_PAYLOAD)" || echo "✗ manca il blocco cifrato"
          grep -o 'PBKDF2-SHA256[^<]\{0,40\}' /tmp/porta.html | head -1
          echo "== intestazioni =="
          curl -sSI --max-time 25 https://cyberboomer.io/ | grep -i -E '^(server|strict-transport|content-type|last-modified):' || true

      - name: 2 · cyberboomer.ninja — HTTPS e versione servita
        run: |
          set -u
          echo | openssl s_client -connect cyberboomer.ninja:443 -servername cyberboomer.ninja 2>/dev/null \
            | openssl x509 -noout -subject -dates 2>/dev/null || echo "✗ nessun certificato letto"
          COD=$(curl -sS -o /tmp/ninja.html -w '%{http_code}' --max-time 25 https://cyberboomer.ninja/ || echo 000)
          echo "codice: $COD · byte: $(wc -c < /tmp/ninja.html)"
          # Dall'08/09 il vestito non sta nella home: sta in /stile.css, uno per tutta la casa.
          # Contare il blu nella home darebbe 0 e si leggerebbe «versione blu non servita».
          grep -c 'href="/stile.css"' /tmp/ninja.html | sed 's/^/la home linka \/stile.css (atteso 1): /'
          CSS=$(curl -sS -o /tmp/ninja.css -w '%{http_code}' --max-time 25 https://cyberboomer.ninja/stile.css || echo 000)
          echo "stile.css → $CSS · byte: $(wc -c < /tmp/ninja.css)"
          grep -c '5C7CFF' /tmp/ninja.css | sed 's/^/occorrenze del blu link #5C7CFF in stile.css (attese 1 o piu): /'
          cat /tmp/ninja.html /tmp/ninja.css | grep -c 'FF2E88' | sed 's/^/occorrenze del magenta #FF2E88 in home + stile.css (attese 0): /'
          grep -o '<title>[^<]*' /tmp/ninja.html
          curl -sS -o /dev/null -w 'lezioni/lezione-001.html → %{http_code}\n' --max-time 25 https://cyberboomer.ninja/lezioni/lezione-001.html || true
          # _config.yml (08/09) toglie scripts/ e strumenti/ dal sito: finche' questa riga non dice 404, e' una dichiarazione.
          curl -sS -o /dev/null -w 'strumenti/collaudo.mjs → %{http_code} (atteso 404: escluso da _config.yml)\n' --max-time 25 https://cyberboomer.ninja/strumenti/collaudo.mjs || true
          curl -sS -o /dev/null -w 'lezioni/_sorgenti/lezione-001.json → %{http_code} (atteso 404: Jekyll non serve le cartelle con _)\n' --max-time 25 https://cyberboomer.ninja/lezioni/_sorgenti/lezione-001.json || true
          curl -sSI --max-time 25 https://cyberboomer.ninja/ | grep -i -E '^(server):' || true

      - name: 3 · console.cyberboomer.io — esiste?
        run: |
          set -u
          echo "DNS:"; getent hosts console.cyberboomer.io || echo "  nessun record (NXDOMAIN)"
          COD=$(curl -sS -o /tmp/c.html -w '%{http_code}' --max-time 20 https://console.cyberboomer.io/ 2>/tmp/err || echo 000)
          echo "https://console.cyberboomer.io/ → $COD $(head -c 120 /tmp/err 2>/dev/null)"

      - name: 4 · Le voci pubbliche — X e radio
        run: |
          set -u
          curl -sS -o /dev/null -w 'https://radio-anima.pages.dev/ → %{http_code}\n' --max-time 25 https://radio-anima.pages.dev/ || true
          COD=$(curl -sS -o /tmp/x.html -w '%{http_code}' --max-time 25 -A 'Mozilla/5.0' https://x.com/cyberboomer || echo 000)
          echo "https://x.com/cyberboomer → $COD (X serve una shell JS a tutti: il codice da solo non dice se l'account esiste)"
          grep -o '<title>[^<]*' /tmp/x.html | head -1 || true

      - name: 5 · Le altre tre case — systema77.com, animagame.io, anima.solar
        run: |
          set -u
          # PERCHE' — il 07/09 i sette repo sono passati all'organizzazione GitHub `Systema77`.
          # Un trasferimento di proprieta' puo' far cadere il dominio personalizzato di Pages, e
          # questa prova guardava due case su sei: cyberboomer.io e .ninja. Le altre tre non le
          # misurava nessuno, quindi «il trasloco non ha rotto niente» era una speranza, non una
          # misura. Solo GET e HEAD, come il resto del file.
          for casa in systema77.com animagame.io anima.solar; do
            echo "== $casa =="
            echo | openssl s_client -connect "$casa":443 -servername "$casa" 2>/dev/null \
              | openssl x509 -noout -subject -dates 2>/dev/null || echo "  ✗ nessun certificato letto"
            COD=$(curl -sS -o /tmp/casa.html -w '%{http_code}' --max-time 25 "https://$casa/" || echo 000)
            echo "  codice: $COD · byte: $(wc -c < /tmp/casa.html)"
            grep -o '<title>[^<]*' /tmp/casa.html | head -1 | sed 's/^/  /'
            curl -sSI --max-time 25 "https://$casa/" | grep -i -E '^(server|last-modified):' | sed 's/^/  /' || true
          done
